<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 参考答案阅览室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <nav class="nav"><div class="nav-inner">
    <a class="brand" href="./">参考答案阅览室<small>深度阅读社区</small></a>
    <div class="nav-links">
      <a href="./browse.html">浏览</a>
      <a href="./co-read.html">共读</a>
      <a href="./studio.html">编辑台</a>
    </div>
  </div></nav>

  <main class="read-container">
    <div class="article" id="article"><div class="empty">加载中…</div></div>

    <section class="notes-box">
      <h3>📝 我的阅读笔记</h3>
      <p class="section-sub">笔记仅保存在本机浏览器，可随时导出，让阅读变成可复利的资产。</p>
      <textarea id="note" placeholder="读到这里，你想到什么？记下一句，比收藏更有用。"></textarea>
      <div class="notes-actions">
        <button class="btn" onclick="saveNote()">保存笔记</button>
        <span id="noteStatus" class="notice"></span>
      </div>
    </section>
  </main>

  <footer>参考答案阅览室 · 深度阅读社区</footer>

  <script src="./js/app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    async function init() {
      const { item } = await API.get(id);
      if (!item) { document.getElementById('article').innerHTML = '<div class="empty">未找到该内容</div>'; return; }
      document.title = item.title + ' · 参考答案阅览室';
      document.getElementById('article').innerHTML = `
        <div class="meta">
          <span>${item.icon} ${esc(item.categoryName)}</span>
          ${item.date ? '<span>'+esc(item.date)+'</span>' : ''}
          ${item.author ? '<span>'+esc(item.author)+'</span>' : ''}
        </div>
        <h1>${esc(item.title)}</h1>
        <div class="markdown">${renderMarkdown(item.body)}</div>
        <div class="tags" style="margin-top:28px;">
          ${(item.tags||[]).map((t)=>'<span class="tag">'+esc(t)+'</span>').join('')}
        </div>`;
      // 载入已存笔记
      document.getElementById('note').value = Notes.get(id) || '';
    }
    let t;
    function saveNote() {
      Notes.set(id, document.getElementById('note').value);
      const s = document.getElementById('noteStatus');
      s.textContent = '已保存 · ' + new Date().toLocaleString('zh-CN');
      clearTimeout(t);
      t = setTimeout(() => (s.textContent = ''), 2000);
    }
    document.getElementById('note').addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(saveNote, 800);
    });
    init();
  </script>
</body>
</html>
