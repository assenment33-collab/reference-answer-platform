<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 · 慢读 Slowread</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <nav class="nav" id="topNav"><div class="nav-inner">
    <a class="brand" href="./">慢读 Slowread<small>深度阅读社区</small></a>
    <div class="nav-links">
      <a href="./browse.html">浏览</a>
      <a href="./co-read.html">共读</a>
      <button class="link-btn" onclick="toggleZen()" title="0 干扰阅读模式">关灯阅读</button>
    </div>
  </div></nav>

  <main class="read-container" id="readMain">
    <div class="article" id="article"><div class="empty">加载中…</div></div>

    <section class="notes-box">
      <h3>📝 我的阅读笔记</h3>
      <p class="section-sub">笔记仅保存在本机浏览器，可随时导出，让阅读变成可复利的资产。</p>
      <textarea id="note" placeholder="读到这里，你想到什么？记下一句，比收藏更有用。"></textarea>
      <div class="notes-actions">
        <button class="btn" onclick="saveNote()">保存笔记</button>
        <span id="noteStatus" class="notice"></span>
      </div>
    </section>
  </main>

  <footer>慢读 Slowread · 深度阅读社区</footer>

  <script src="./js/app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    async function init() {
      const { item } = await API.get(id);
      if (!item) { document.getElementById('article').innerHTML = '<div class="empty">未找到该内容</div>'; return; }
      document.title = item.title + ' · 慢读 Slowread';

      const hasChapters = item.chapters && item.chapters.length;
      const chaptersHtml = hasChapters ? `
        <nav class="chapter-nav">
          <div class="chapter-label">章节导航</div>
          ${item.chapters.map((c, i) => `<a href="#ch-${i}" onclick="scrollToChapter(event,'ch-${i}')">0${i+1} ${esc(c)}</a>`).join('')}
        </nav>` : '';

      const abstractHtml = item.abstract ? `
        <div class="article-abstract">
          <div class="abstract-label">文章摘要</div>
          <p>${esc(item.abstract)}</p>
        </div>` : '';

      let bodyHtml = renderMarkdown(item.body);
      // 给 h2 加锚点，用于章节导航
      if (hasChapters) {
        let idx = 0;
        bodyHtml = bodyHtml.replace(/<h2[^>]*>/g, (m) => {
          return `<h2 id="ch-${idx++}">`;
        });
      }

      document.getElementById('article').innerHTML = `
        <div class="meta">
          <span>${item.icon} ${esc(item.categoryName)}</span>
          ${item.date ? '<span>'+esc(item.date)+'</span>' : ''}
          ${item.author ? '<span>'+esc(item.author)+'</span>' : ''}
        </div>
        <h1>${esc(item.title)}</h1>
        ${abstractHtml}
        ${chaptersHtml}
        <div class="markdown">${bodyHtml}</div>
        <div class="tags" style="margin-top:28px;">
          ${(item.tags||[]).map((t)=>'<span class="tag">'+esc(t)+'</span>').join('')}
        </div>`;

      // 高亮金句点击复制
      document.querySelectorAll('.markdown mark').forEach((el) => {
        el.title = '点击复制金句';
        el.addEventListener('click', () => {
          const text = el.textContent;
          navigator.clipboard.writeText(text).then(() => toast('金句已复制：' + text.slice(0, 18) + (text.length>18?'...':'')));
        });
      });

      // 载入已存笔记
      document.getElementById('note').value = Notes.get(id) || '';
    }
    function scrollToChapter(e, anchor) {
      e.preventDefault();
      const el = document.getElementById(anchor);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    window.scrollToChapter = scrollToChapter;

    let t;
    function saveNote() {
      Notes.set(id, document.getElementById('note').value);
      const s = document.getElementById('noteStatus');
      s.textContent = '已保存 · ' + new Date().toLocaleString('zh-CN');
      clearTimeout(t);
      t = setTimeout(() => (s.textContent = ''), 2000);
    }
    document.getElementById('note').addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(saveNote, 800);
    });

    function toggleZen() {
      document.body.classList.toggle('zen-mode');
      const btn = document.querySelector('button[onclick="toggleZen()"]');
      if (btn) btn.textContent = document.body.classList.contains('zen-mode') ? '开灯阅读' : '关灯阅读';
    }
    window.toggleZen = toggleZen;

    init();
  </script>
</body>
</html>
